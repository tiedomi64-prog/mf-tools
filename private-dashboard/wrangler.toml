# MF Studio — affichage iPad privé (Worker distinct du GitHub Pages public)
name = "mf-studio-ipad-prive"
main = "src/index.js"
compatibility_date = "2026-11-15"
workers_dev = true

# À remplacer par l'ID retourné par: npx wrangler kv namespace create STORE
[[kv_namespaces]]
binding = "STORE"
id = "REMPLACER_PAR_ID_NAMESPACE_KV"

[assets]
directory = "./site"
binding = "ASSETS"
run_worker_first = true

# Récupération des sources toutes les 15 minutes. Exécution en UTC.
[triggers]
crons = ["*/15 * * * *"]
